<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greeting Page</title>

<style>
    body {
    background: linear-gradient(to right, #74ebd5, #ACB6E5);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,.2);
    text-align: center;
}

    h1 {
        color: #333;
        margin-bottom: 25px;
    }

    select {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
}

    /* Heart Button */
    .heart-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        
    }

    .heart-btn {
        position: relative;
        width: 70px;
        height: 70px;
        background: #ff4d6d;
        transform: rotate(-45deg);
        border: none;
        cursor: pointer;
        margin-top: 20px;
        transition: transform 0.2s;
    }

    .heart-btn:hover {
        transform: rotate(-45deg) scale(1.1);
    }

    .heart-btn::before,
    .heart-btn::after {
        content: "";
        position: absolute;
        width: 70px;
        height: 70px;
        background: #ff4d6d;
        border-radius: 50%;
    }

    .heart-btn::before {
        top: -35px;
        left: 0;
    }

    .heart-btn::after {
        left: 35px;
        top: 0;
    }

    .heart-text {
        font-weight: bold;
        color: #d6336c;
        margin-bottom: 15px;
    }

    #message {
        margin-top: 20px;
        font-size: 22px;
        color: green;
        font-weight: bold;
    }

    .flower{
    position: fixed;
    top: -50px;
    font-size: 30px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 9999;
}

@keyframes fall{
    0%{
        transform: translateY(0) rotate(0deg);
        opacity:1;
    }

    100%{
        transform: translateY(110vh) rotate(720deg);
        opacity:0;
    }
}



</style>

</head>
<body>

<div class="container">

    <h1>Hey Beautiful! 💐</h1>

    <select id="person">
        <option value="">-- Select your name --</option>
        <option>Pottiii</option>
        <option>Chinkyy</option>
        <option>Manasss</option>
        <option>Manuuuu</option>
        <option>Buddiii</option>
    </select>

    <div class="heart-container">
        <div class="heart-text">Press this Heart</div>

        <button class="heart-btn" onclick="showMessage()"></button>
    </div>

    <div id="message"></div>

</div>

<script>
function showMessage() {

    let person = document.getElementById("person").value;
    let message = document.getElementById("message");

    if(person === ""){
        alert("Please select your name first!");
        return;
    }
    message.innerHTML = person + "...smaaart ra nuvvu!😜❤️ <br> Always carry that pretty smile of yours, it suits you better 😉☺️ <br> Have a great day dear! ❤️😘";

     flowerShower();
}

function flowerShower(){

    const flowers = ["🥳","💐","Manas","🥰","💐","😍","Potti","💐","😁","💐","Cutie","🤩","💐","😘"];

    for(let i=0;i<80;i++){

        const flower = document.createElement("div");

        flower.className = "flower";
        flower.innerHTML = flowers[Math.floor(Math.random()*flowers.length)];

        flower.style.left = Math.random()*100 + "vw";

        flower.style.animationDuration =
            (3 + Math.random()*3) + "s";

        flower.style.fontSize =
            (20 + Math.random()*25) + "px";

        flower.style.animationDelay =
            Math.random()*1 + "s";

        document.body.appendChild(flower);

        setTimeout(()=>{
            flower.remove();
        },6000);
    }
}
</script>

</body>
</html>
