<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greeting Page</title>

<style>
    body {
    background: linear-gradient(to right, #74ebd5, #ACB6E5);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,.2);
    text-align: center;
}

    h1 {
        color: #333;
        margin-bottom: 25px;
    }

    select {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
}

    /* Heart Button */
    .heart-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        
    }

    .heart-btn {
        position: relative;
        width: 70px;
        height: 70px;
        background: #ff4d6d;
        transform: rotate(-45deg);
        border: none;
        cursor: pointer;
        margin-top: 20px;
        transition: transform 0.2s;
    }

    .heart-btn:hover {
        transform: rotate(-45deg) scale(1.1);
    }

    .heart-btn::before,
    .heart-btn::after {
        content: "";
        position: absolute;
        width: 70px;
        height: 70px;
        background: #ff4d6d;
        border-radius: 50%;
    }

    .heart-btn::before {
        top: -35px;
        left: 0;
    }

    .heart-btn::after {
        left: 35px;
        top: 0;
    }

    .heart-text {
        font-weight: bold;
        color: #d6336c;
        margin-bottom: 15px;
    }

    #message {
        margin-top: 20px;
        font-size: 22px;
        color: green;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="container">

    <h1>Hey Beautiful! 💐</h1>

    <select id="person">
        <option value="">-- Select your name --</option>
        <option>Pottiiiiii</option>
        <option>Chinkyyyyy</option>
        <option>Manassssss</option>
        <option>Manuuuuuuu</option>
        <option>Buddiiiiii</option>
    </select>

    <div class="heart-container">
        <div class="heart-text">Press this Heart</div>

        <button class="heart-btn" onclick="showMessage()"></button>
    </div>

    <div id="message"></div>

</div>

<script>
function showMessage() {

    let person = document.getElementById("person").value;
    let message = document.getElementById("message");

    if(person === ""){
        alert("Please select your name first!");
        return;
    }
    message.innerHTML = person + "...smaaart ra nuvvu!😜❤️ <br> Always carry that pretty smile of yours, it suits you better 😉☺️ <br> Have a great day dear! ❤️😘";
}
</script>

</body>
</html>
